<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Information Security & Risk Management - Midterm Quiz</title>
<style>
    :root {
        --primary: #2563eb;
        --primary-hover: #1d4ed8;
        --success: #16a34a;
        --success-bg: #dcfce7;
        --danger: #dc2626;
        --danger-bg: #fee2e2;
        --bg: #f1f5f9;
        --card-bg: #ffffff;
        --text: #1e293b;
        --text-muted: #64748b;
        --border: #e2e8f0;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--bg);
        color: var(--text);
        display: flex;
        justify-content: center;
        padding: 20px 10px;
        min-height: 100vh;
    }

    #quiz-container {
        background: var(--card-bg);
        width: 100%;
        max-width: 900px;
        border-radius: 14px;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    #header {
        background: linear-gradient(135deg, #1e3a8a, #2563eb);
        color: #ffffff;
        padding: 22px 25px;
        text-align: center;
    }

    #header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        margin-bottom: 6px;
    }

    #header p {
        font-size: 0.95rem;
        opacity: 0.9;
    }

    #progress-bar-container {
        background-color: #e2e8f0;
        height: 6px;
        width: 100%;
    }

    #progress-bar {
        background-color: #10b981;
        height: 100%;
        width: 0%;
        transition: width 0.3s ease;
    }

    #quiz-body {
        padding: 28px 24px;
        flex: 1;
    }

    .q-badge {
        display: inline-block;
        padding: 4px 10px;
        border-radius: 9999px;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        margin-bottom: 12px;
    }

    .badge-single {
        background: #e0e7ff;
        color: #3730a3;
    }

    .badge-multi {
        background: #fef3c7;
        color: #92400e;
    }

    #question-text {
        font-size: 1.15rem;
        font-weight: 600;
        line-height: 1.5;
        margin-bottom: 20px;
    }

    .options-list {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-bottom: 20px;
    }

    .option-item {
        border: 2px solid var(--border);
        border-radius: 8px;
        padding: 12px 16px;
        display: flex;
        align-items: center;
        gap: 12px;
        cursor: pointer;
        transition: all 0.2s ease;
        background-color: #fff;
        user-select: none;
    }

    .option-item:hover {
        border-color: #93c5fd;
        background-color: #f8fafc;
    }

    .option-item input[type="radio"],
    .option-item input[type="checkbox"] {
        width: 18px;
        height: 18px;
        accent-color: var(--primary);
        cursor: pointer;
    }

    .option-item.selected {
        border-color: var(--primary);
        background-color: #eff6ff;
    }

    .option-item.correct {
        border-color: var(--success) !important;
        background-color: var(--success-bg) !important;
        color: #14532d;
        font-weight: 600;
    }

    .option-item.incorrect {
        border-color: var(--danger) !important;
        background-color: var(--danger-bg) !important;
        color: #7f1d1d;
    }

    .option-item.disabled {
        pointer-events: none;
    }

    #feedback-box {
        display: none;
        padding: 16px;
        border-radius: 8px;
        margin-bottom: 20px;
        border-left: 4px solid var(--primary);
        background-color: #f8fafc;
        line-height: 1.5;
        font-size: 0.95rem;
    }

    #palette {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(36px, 1fr));
        gap: 8px;
        padding: 15px 24px;
        background-color: #f8fafc;
        border-top: 1px solid var(--border);
        max-height: 130px;
        overflow-y: auto;
    }

    .palette-btn {
        height: 36px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.85rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.15s;
    }

    .palette-btn.current {
        border: 2px solid var(--primary);
        color: var(--primary);
        box-shadow: 0 0 0 1px var(--primary);
    }

    .palette-btn.correct {
        background-color: var(--success);
        color: white;
        border-color: var(--success);
    }

    .palette-btn.incorrect {
        background-color: var(--danger);
        color: white;
        border-color: var(--danger);
    }

    #footer {
        padding: 16px 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background-color: #fff;
        border-top: 1px solid var(--border);
        gap: 10px;
    }

    .btn {
        padding: 10px 20px;
        border-radius: 8px;
        border: none;
        font-weight: 600;
        font-size: 0.95rem;
        cursor: pointer;
        transition: 0.2s;
    }

    .btn-primary {
        background: var(--primary);
        color: white;
    }

    .btn-primary:hover {
        background: var(--primary-hover);
    }

    .btn-secondary {
        background: #e2e8f0;
        color: #334155;
    }

    .btn-secondary:hover {
        background: #cbd5e1;
    }

    .btn-success {
        background: var(--success);
        color: white;
    }

    .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    /* Results Screen */
    #result-view {
        display: none;
        padding: 40px 20px;
        text-align: center;
    }

    #result-score {
        font-size: 3.5rem;
        font-weight: 800;
        color: var(--primary);
        margin: 15px 0;
    }
</style>
</head>
<body>

<div id="quiz-container">
    <div id="header">
        <h1>Information Security & Assurance - Practice Quiz</h1>
        <p>SLIIT NetExam Midterm Revision (Single & Multi-Select Questions)</p>
    </div>

    <div id="progress-bar-container">
        <div id="progress-bar"></div>
    </div>

    <div id="quiz-body">
        <div id="badge-container"></div>
        <div id="question-text"></div>
        <ul class="options-list" id="options-list"></ul>
        <div id="feedback-box"></div>
    </div>

    <div id="palette"></div>

    <div id="footer">
        <button id="prev-btn" class="btn btn-secondary">Previous</button>
        <button id="action-btn" class="btn btn-primary">Check Answer</button>
        <button id="next-btn" class="btn btn-secondary">Next</button>
    </div>

    <div id="result-view">
        <h2>ප්‍රශ්නාවලිය අවසන්!</h2>
        <p style="color: var(--text-muted); margin-top: 8px;">ඔබ ලබාගත් සමස්ත ලකුණු ප්‍රමාණය:</p>
        <div id="result-score">0 / 0</div>
        <p id="result-summary" style="font-size: 1.1rem; margin-bottom: 25px;"></p>
        <button onclick="restartQuiz()" class="btn btn-primary" style="padding: 12px 30px;">නැවත ආරම්භ කරන්න (Restart)</button>
    </div>
</div>

<script>
// ---------- EXAM QUESTIONS EXTRACTED DIRECTLY FROM VIDEO ----------
const quizQuestions = [
    {
        id: 1,
        type: "single",
        question: "A(n) ________ is an attempt to learn or make use of information from the system that does not affect system resources.",
        options: [
            "Outside attack",
            "Passive attack",
            "Inside attack",
            "Denial-of-Service Attack",
            "Active attack"
        ],
        correct: [1],
        explanation: "<b>Passive attack:</b> පද්ධති සම්පත් වලට හානි නොකර තොරතුරු නිරීක්ෂණය කිරීම හෝ ලබා ගැනීම Passive attack (උදා: Eavesdropping, Traffic monitoring) ලෙස හඳුන්වයි. සම්පත් වලට වෙනස්කම් සිදු කරන්නේ Active attack මඟිනි."
    },
    {
        id: 2,
        type: "single",
        question: "What is the correct sequence for a standard Risk Assessment?",
        options: [
            "Risk Analysis → Evaluation → Risk Identification → Countermeasures",
            "Risk Identification → Evaluation → Countermeasures → Analysis",
            "Risk Analysis → Risk Identification → Evaluation → Countermeasures",
            "Risk Identification → Evaluation → Countermeasures → Analysis",
            "Risk Identification → Analysis → Evaluation → Countermeasures"
        ],
        correct: [4],
        explanation: "<b>Risk Assessment Sequence:</b> සම්මත අවදානම් තක්සේරු අනුපිළිවෙල වන්නේ ප්‍රථමයෙන් අවදානම් හඳුනාගැනීම (Identification), පසුව විශ්ලේෂණය (Analysis), අනතුරුව ඇගයීම (Evaluation), සහ අවසානයේ පාලක පියවර (Countermeasures) යෙදීමයි."
    },
    {
        id: 3,
        type: "multiple",
        question: "Which of the following statement(s) is/are false about OCTAVE security evaluation framework? (Select one or more)",
        options: [
            "Framework is technology focused",
            "It was developed by Carnegie Mellon University",
            "Framework is based on critical assets of an organization",
            "Framework uses a top-down approach",
            "Framework needs limited preparation time"
        ],
        correct: [0, 4],
        explanation: "<b>OCTAVE Framework:</b> OCTAVE යනු ආයතනයේ වැදගත් වත්කම් (Critical Assets) මුල් කරගත් (Asset-driven / Organizational focused) රාමුවක් වන අතර එය Technology focused නොවේ. එමෙන්ම එය ක්‍රියාත්මක කිරීමට සීමිත කාලයක් නොව පුළුල් පෙර සූදානමක් (extensive preparation) අවශ්‍ය වේ. එබැවින් (a) සහ (e) අසත්‍ය (False) ප්‍රකාශ වේ."
    },
    {
        id: 4,
        type: "single",
        question: "A ________ represents a potential harm to the system resource.",
        options: [
            "phish",
            "control",
            "vulnerability",
            "threat",
            "spoof"
        ],
        correct: [3],
        explanation: "<b>Threat:</b> පද්ධති සම්පතකට හානියක් සිදු කළ හැකි ඕනෑම විභව සාධකයක් හෝ තත්වයක් Threat (තර්ජනයක්) ලෙස හැඳින්වේ. Vulnerability යනු පද්ධතියේ ඇති දුර්වලතාවයයි."
    },
    {
        id: 5,
        type: "single",
        question: "A(n) ________ is an action, device, procedure, or technique that reduces a threat, a vulnerability, or an attack by eliminating or preventing it, by minimizing the harm it can cause, or by discovering and reporting it so that correct action can be taken.",
        options: [
            "Adversary",
            "Countermeasure",
            "Threat",
            "Asset",
            "Attack"
        ],
        correct: [1],
        explanation: "<b>Countermeasure:</b> තර්ජනයක් හෝ දුර්වලතාවයක් වළක්වා ගැනීමට හෝ හානිය අවම කිරීමට යොදන පාලක ක්‍රමවේදය හෝ ක්‍රියාමාර්ගය Countermeasure (ප්‍රතිපියවරක්) වේ."
    },
    {
        id: 6,
        type: "single",
        question: "Which one of the following statements describes the term 'RISK' in IT?",
        options: [
            "Risk is the overall weakness of a system",
            "Risk is the existence of a vulnerability & a matching threat",
            "Risk is the probability of the attack",
            "Risk is a potentially exploitable weakness",
            "Risk is the implementation of a threat"
        ],
        correct: [1],
        explanation: "<b>RISK:</b> තොරතුරු තාක්ෂණයේදී Risk යනු දුර්වලතාවයක් (Vulnerability) සහ ඊට ගැලපෙන තර්ජනයක් (Matching Threat) එකට සම්භාවිත වීමයි (Threat × Vulnerability)."
    },
    {
        id: 7,
        type: "single",
        question: "What is the size of the key space for a cipher that uses a key containing 10 bits?",
        options: [
            "20",
            "256",
            "512",
            "1024",
            "2048"
        ],
        correct: [3],
        explanation: "<b>Key Space Calculation:</b> 10-bit key එකක ඇති මුළු අගයන් ගණන (Key space) වන්නේ 2<sup>10</sup> = 1024 කි."
    },
    {
        id: 8,
        type: "single",
        question: "Bob intercepts an encrypted message and wants to determine what type of algorithm was used to create the message. He first performs a frequency analysis and notes that the frequency of letters in the message closely matches the distribution of letters in the English language. What type of cipher was most likely used to create this message?",
        options: [
            "Substitution cipher",
            "Transposition cipher",
            "DES",
            "AES",
            "3DES"
        ],
        correct: [1],
        explanation: "<b>Transposition Cipher:</b> මෙහිදී අකුරු වෙනස් නොකර ඒවායේ පිහිටීම (order/position) පමණක් මාරු කරන බැවින්, භාෂාවේ සාමාන්‍ය අකුරු සංඛ්‍යාතය (Letter frequency distribution) වෙනස් නොවී පවතී."
    },
    {
        id: 9,
        type: "single",
        question: "Which statement describes the use of keys for encryption?",
        options: [
            "The sender and receiver must use two keys: one for symmetric encryption and another for asymmetric encryption.",
            "The sender and receiver must use the same key when using symmetric encryption.",
            "The sender and receiver must use the same keys for both symmetric and asymmetric encryption.",
            "The sender and receiver must use two keys: one for symmetric encryption and another for symmetric decryption."
        ],
        correct: [1],
        explanation: "<b>Symmetric Encryption:</b> සමමිතික ගුප්තකේතනයේදී දත්ත සංකේතනය (encryption) සහ විකේතනය (decryption) යන දෙකටම යවන්නා සහ ලබන්නා භාවිතා කරන්නේ එකම රහස් යතුරයි (Same key)."
    },
    {
        id: 10,
        type: "single",
        question: "________ assures that individuals control or influence what information related to them may be collected and stored and by whom and to whom that information may be disclosed.",
        options: [
            "Data Integrity",
            "System Integrity",
            "Authenticity",
            "Availability",
            "Privacy"
        ],
        correct: [4],
        explanation: "<b>Privacy:</b> පුද්ගලයෙකු පිළිබඳ දත්ත රැස් කිරීම, ගබඩා කිරීම සහ බෙදා හැරීම පාලනය කිරීමට එම පුද්ගලයාට ඇති අයිතිය සහ හැකියාව Privacy (පෞද්ගලිකත්වය) වේ."
    },
    {
        id: 11,
        type: "single",
        question: "Which symmetric encryption algorithm is the most difficult to crack?",
        options: [
            "DES",
            "RSA",
            "3DES",
            "AES",
            "SHA"
        ],
        correct: [3],
        explanation: "<b>AES (Advanced Encryption Standard):</b> ලබා දී ඇති Symmetric ඇල්ගොරිතම අතරින් විශාල key sizes (128, 192, 256 bits) සහිත වඩාත්ම ආරක්ෂිත සහ කැඩීමට අපහසුම ඇල්ගොරිතමය AES වේ. (RSA යනු Asymmetric වන අතර SHA යනු Hashing ඇල්ගොරිතමයකි)."
    },
    {
        id: 12,
        type: "single",
        question: "What are the two main identifiable components needed to calculate 'Risk'?",
        options: [
            "Impact & Damage",
            "Impact & Threat",
            "Probability of Occurrence & Threat",
            "Impact & Probability of Occurrence",
            "Threat & Control Level"
        ],
        correct: [3],
        explanation: "<b>Risk Formula:</b> Risk = Impact × Probability (Likelihood of occurrence). එනම් බලපෑම සහ සිදුවීමේ සම්භාවිතාවයි."
    },
    {
        id: 13,
        type: "multiple",
        question: "Which of the following are valid risk management behaviors? (Choose Two)",
        options: [
            "Mitigate the risk",
            "Transfer the risk",
            "Ignore the risk",
            "Forget the risk"

        explanation: "<b>COBIT 5 Principles:</b> COBIT 5 මූලධර්ම පහ වන්නේ: 1. Meeting Stakeholder Needs, 2. Covering the Enterprise End-to-End, 3. Applying a Single Integrated Framework, 4. Enabling a Holistic Approach, 5. Separating Governance from Management වේ. Compliance Verification යනු මූලධර්මයක් නොවේ."
    },
    {
        id: 34,
        type: "single",
        question: "OCTAVE-S is a specialized framework for small sized organizations.",
        options: [
            "True",
            "False"
        ],
        correct: [0],
        explanation: "<b>OCTAVE-S:</b> ඔව්, OCTAVE-S යනු සීමිත සම්පත් සහිත කුඩා පරිමාණ ආයතන (Small sized organizations) සඳහා විශේෂයෙන් සකස් කළ OCTAVE අනුවාදයයි."
    }
];

// ---------- APP STATE ----------
let currentIndex = 0;
let userSelections = {}; // questionIndex: [selectedIndices]
let checkedStatus = {};  // questionIndex: true/false

const badgeContainer = document.getElementById('badge-container');
const questionText = document.getElementById('question-text');
const optionsList = document.getElementById('options-list');
const feedbackBox = document.getElementById('feedback-box');
const palette = document.getElementById('palette');
const progressBar = document.getElementById('progress-bar');

const prevBtn = document.getElementById('prev-btn');
const nextBtn = document.getElementById('next-btn');
const actionBtn = document.getElementById('action-btn');

function initPalette() {
    palette.innerHTML = '';
    quizQuestions.forEach((q, idx) => {
        const btn = document.createElement('button');
        btn.className = 'palette-btn';
        btn.id = `pal-${idx}`;
        btn.innerText = idx + 1;
        btn.onclick = () => goToQuestion(idx);
        palette.appendChild(btn);
    });
}

function loadQuestion(index) {
    currentIndex = index;
    const q = quizQuestions[index];

    // Progress bar update
    const progressPercent = ((index + 1) / quizQuestions.length) * 100;
    progressBar.style.width = `${progressPercent}%`;

    // Type Badge
    const isMulti = q.type === "multiple";
    badgeContainer.innerHTML = isMulti
        ? `<span class="q-badge badge-multi">Multiple Choice (එකකට වඩා තෝරන්න)</span>`
        : `<span class="q-badge badge-single">Single Choice (තනි පිළිතුරක්)</span>`;

    questionText.innerHTML = `${index + 1}. ${q.question}`;
    optionsList.innerHTML = '';
    feedbackBox.style.display = 'none';

    const isChecked = checkedStatus[index] || false;
    const currentSelections = userSelections[index] || [];

    q.options.forEach((optText, optIdx) => {
        const li = document.createElement('li');
        li.className = 'option-item';

        const input = document.createElement('input');
        input.type = isMulti ? 'checkbox' : 'radio';
        input.name = `question-${index}`;
        input.value = optIdx;
        input.checked = currentSelections.includes(optIdx);

        if (isChecked) {
            li.classList.add('disabled');
            input.disabled = true;

            const isCorrect = q.correct.includes(optIdx);
            const isUserChoice = currentSelections.includes(optIdx);

            if (isCorrect) {
                li.classList.add('correct');
            } else if (isUserChoice && !isCorrect) {
                li.classList.add('incorrect');
            }
        } else {
            if (currentSelections.includes(optIdx)) {
                li.classList.add('selected');
            }
            li.onclick = (e) => {
                if (e.target !== input) {
                    input.checked = isMulti ? !input.checked : true;
                }
                handleOptionClick(optIdx, isMulti);
            };
        }

        const label = document.createElement('span');
        label.innerHTML = optText;

        li.appendChild(input);
        li.appendChild(label);
        optionsList.appendChild(li);
    });

    if (isChecked) {
        showFeedback(q, currentSelections);
        actionBtn.innerText = index === quizQuestions.length - 1 ? "Finish Quiz" : "Next Question";
        actionBtn.className = "btn btn-primary";
    } else {
        actionBtn.innerText = "Check Answer";
        actionBtn.className = "btn btn-primary";
    }

    prevBtn.disabled = index === 0;
    nextBtn.disabled = index === quizQuestions.length - 1;

    updatePalette();
}

function handleOptionClick(optIdx, isMulti) {
    if (!userSelections[currentIndex]) {
        userSelections[currentIndex] = [];
    }

    if (isMulti) {
        const pos = userSelections[currentIndex].indexOf(optIdx);
        if (pos > -1) {
            userSelections[currentIndex].splice(pos, 1);
        } else {
            userSelections[currentIndex].push(optIdx);
        }
    } else {
        userSelections[currentIndex] = [optIdx];
    }

    // Refresh UI selection classes
    const items = optionsList.querySelectorAll('.option-item');
    items.forEach((item, i) => {
        if (userSelections[currentIndex].includes(i)) {
            item.classList.add('selected');
        } else {
            item.classList.remove('selected');
        }
    });
}

function handleAction() {
    const q = quizQuestions[currentIndex];
    const isChecked = checkedStatus[currentIndex];

    if (!isChecked) {
        const selections = userSelections[currentIndex] || [];
        if (selections.length === 0) {
            alert("කරුණාකර අවම වශයෙන් එක් පිළිතුරක් හෝ තෝරන්න!");
            return;
        }

        checkedStatus[currentIndex] = true;
        loadQuestion(currentIndex);
    } else {
        if (currentIndex < quizQuestions.length - 1) {
            goToQuestion(currentIndex + 1);
        } else {
            showFinalResults();
        }
    }
}

function showFeedback(q, userAns) {
    feedbackBox.style.display = 'block';

    // Verify correctness
    const isAllCorrect = q.correct.length === userAns.length &&
                         q.correct.every(val => userAns.includes(val));

    const resultBanner = isAllCorrect
        ? `<div style="color: var(--success); font-weight: bold; margin-bottom: 6px;">✔ නිවැරදියි! (Correct)</div>`
        : `<div style="color: var(--danger); font-weight: bold; margin-bottom: 6px;">✖ වැරදියි! (Incorrect)</div>`;

    feedbackBox.innerHTML = `${resultBanner} ${q.explanation}`;
}

function updatePalette() {
    quizQuestions.forEach((q, idx) => {
        const btn = document.getElementById(`pal-${idx}`);
        btn.className = 'palette-btn';

        if (idx === currentIndex) {
            btn.classList.add('current');
        }

        if (checkedStatus[idx]) {
            const userAns = userSelections[idx] || [];
            const isAllCorrect = q.correct.length === userAns.length &&
                                 q.correct.every(val => userAns.includes(val));
            if (isAllCorrect) {
                btn.classList.add('correct');
            } else {
                btn.classList.add('incorrect');
            }
        }
    });
}

function goToQuestion(index) {
    if (index >= 0 && index < quizQuestions.length) {
        loadQuestion(index);
    }
}

function showFinalResults() {
    document.getElementById('quiz-body').style.display = 'none';
    document.getElementById('palette').style.display = 'none';
    document.getElementById('footer').style.display = 'none';

    let score = 0;
    quizQuestions.forEach((q, idx) => {
        const userAns = userSelections[idx] || [];
        const isAllCorrect = q.correct.length === userAns.length &&
                             q.correct.every(val => userAns.includes(val));
        if (isAllCorrect) score++;
    });

    const resultView = document.getElementById('result-view');
    const resultScore = document.getElementById('result-score');
    const resultSummary = document.getElementById('result-summary');

    resultScore.innerText = `${score} / ${quizQuestions.length}`;
    const percentage = Math.round((score / quizQuestions.length) * 100);
    resultSummary.innerText = `ඔබේ සාර්ථකත්වය: ${percentage}% කි.`;

    resultView.style.display = 'block';
}

function restartQuiz() {
    userSelections = {};
    checkedStatus = {};
    document.getElementById('quiz-body').style.display = 'block';
    document.getElementById('palette').style.display = 'grid';
    document.getElementById('footer').style.display = 'flex';
    document.getElementById('result-view').style.display = 'none';
    loadQuestion(0);
}

// Event Listeners
prevBtn.onclick = () => goToQuestion(currentIndex - 1);
nextBtn.onclick = () => goToQuestion(currentIndex + 1);
actionBtn.onclick = handleAction;

// Initialize
initPalette();
loadQuestion(0);
</script>
</body>
</html>
